<title>Hellfest - Mon Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--hf-black:#0a0a0a;--hf-dark:#1a1a1a;--hf-orange:#e85d26;--hf-gold:#d4a017;--hf-grey:#888;--hf-white:#eee;--hf-green:#27ae60}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--hf-black);color:var(--hf-white);font-family:'Oswald',sans-serif;min-height:100vh;overflow-x:hidden}
header{background:linear-gradient(180deg,#111,var(--hf-black));text-align:center;padding:25px 15px 10px;border-bottom:3px solid var(--hf-orange);position:sticky;top:0;z-index:100}
header h1{font-family:'Metal Mania',cursive;font-size:2.4rem;color:var(--hf-orange);text-transform:uppercase;letter-spacing:4px;text-shadow:0 0 20px rgba(232,93,38,.5)}
header .subtitle{font-size:.85rem;color:var(--hf-grey);letter-spacing:2px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 10px 6px;background:var(--hf-dark);border-bottom:1px solid #333;position:sticky;top:89px;z-index:99}
.tab-btn{background:#333;color:var(--hf-white);border:1px solid #444;padding:8px 14px;font-family:'Oswald',sans-serif;font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all .2s;border-radius:3px}
.tab-btn:hover{background:#444}
.tab-btn.active{background:var(--hf-orange);color:#fff;border-color:var(--hf-orange)}
.tab-btn.now-btn.active{background:var(--hf-green);border-color:var(--hf-green)}
.tab-btn.now-btn .pulse{display:inline-block;width:8px;height:8px;background:#2ecc71;border-radius:50%;margin-right:5px;animation:pulse-anim 1.5s infinite}
@keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.filter-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:6px 10px 4px;background:var(--hf-dark);border-bottom:1px solid #333}
.sort-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:4px 10px 10px;background:var(--hf-dark);border-bottom:1px solid #333}
.filter-btn,.sort-btn{background:transparent;color:var(--hf-grey);border:1px solid #444;padding:5px 12px;font-family:'Oswald',sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all .2s;border-radius:2px}
.filter-btn:hover,.sort-btn:hover{color:var(--hf-white);border-color:#666}
.filter-btn.active{color:var(--hf-gold);border-color:var(--hf-gold)}
.sort-btn.active{color:var(--hf-green);border-color:var(--hf-green)}
.search-bar{padding:8px 15px;background:var(--hf-dark)}
.search-bar input[type=text]{width:100%;padding:10px 15px;background:#2a2a2a;border:1px solid #444;color:var(--hf-white);font-family:'Oswald',sans-serif;font-size:1rem;border-radius:3px;outline:none}
.search-bar input[type=text]:focus{border-color:var(--hf-orange)}
.search-bar input[type=text]::placeholder{color:#666}
.stats-bar{display:flex;justify-content:center;gap:20px;padding:8px 10px;background:var(--hf-black);font-size:.8rem;color:var(--hf-grey);border-bottom:1px solid #222}
.stats-bar span strong{color:var(--hf-orange)}
#grid{display:grid;grid-template-columns:1fr;gap:0;max-width:900px;margin:0 auto}
.day-header{padding:12px 15px 6px;background:#111;color:var(--hf-orange);font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:.85rem;border-bottom:1px solid #333}
.time-header{padding:8px 15px;background:#181818;color:var(--hf-green);font-weight:600;letter-spacing:1px;font-size:.8rem;border-bottom:1px solid #2a2a2a;border-left:3px solid var(--hf-green)}
.band-card{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--hf-dark);border-bottom:1px solid #2a2a2a;transition:background .15s;flex-wrap:wrap}
.band-card:hover{background:#252525}
.band-card.now-playing{background:#1a2e1a;border-left:3px solid var(--hf-green)}
.band-card.now-playing .band-name{color:var(--hf-green)}
.now-badge{display:inline-block;background:var(--hf-green);color:#fff;padding:1px 6px;border-radius:2px;font-size:.6rem;font-weight:700;animation:pulse-anim 1.5s infinite;margin-left:6px;vertical-align:middle}
/* ── Priority stars ── */
.star-group{display:flex;flex-direction:column;gap:3px;flex-shrink:0;align-items:center}
.star-btn{background:transparent;border:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:1px 3px;border-radius:3px;transition:transform .15s,filter .15s;opacity:.22;filter:grayscale(1)}
.star-btn:hover{opacity:.7;transform:scale(1.2);filter:grayscale(0)}
.star-btn.active{opacity:1;filter:grayscale(0);transform:scale(1.1)}
.star-btn[data-rank="1"].active{filter:drop-shadow(0 0 4px #f1c40f)}
.star-btn[data-rank="2"].active{filter:drop-shadow(0 0 4px #e85d26)}
.star-btn[data-rank="3"].active{filter:drop-shadow(0 0 4px #3498db)}
/* ── Band info ── */
.band-info{flex:1;min-width:0}
.band-name{font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.band-name:hover{color:var(--hf-orange)}
.band-meta{font-size:.75rem;color:var(--hf-grey);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stage-badge{display:inline-block;padding:1px 7px;border-radius:2px;font-size:.65rem;font-weight:600;color:#fff}
.stage-ms1{background:#c0392b}.stage-ms2{background:#2980b9}.stage-warzone{background:#27ae60}
.stage-valley{background:#8e44ad}.stage-temple{background:#555}.stage-altar{background:#d35400}
/* ── Priority badge on card ── */
.prio-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:4px;vertical-align:middle;letter-spacing:.5px}
.prio-badge.p1{background:#f1c40f;color:#111}
.prio-badge.p2{background:#e85d26;color:#fff}
.prio-badge.p3{background:#3498db;color:#fff}
/* ── Rating input ── */
.rating-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.rating-wrap input[type=number]{width:68px;padding:5px 8px;background:#1e1e1e;border:1px solid #555;color:#888;font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:700;border-radius:4px;outline:none;transition:border-color .15s,color .15s,background .15s;-moz-appearance:textfield;text-align:center}
.rating-wrap input[type=number]::-webkit-inner-spin-button,.rating-wrap input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.rating-wrap input[type=number]:focus{border-color:var(--hf-gold)}
.rating-wrap input[type=number].has-value{border-color:var(--hf-gold);color:var(--hf-gold);background:#1e1a08}
.rating-suffix{font-size:.75rem;color:#555;font-family:'Oswald',sans-serif;font-weight:600;flex-shrink:0;transition:color .15s}
.rating-suffix.has-value{color:var(--hf-gold)}
.clear-btn{background:transparent;border:none;color:#444;cursor:pointer;font-size:.85rem;padding:2px 4px;border-radius:2px;transition:color .15s;line-height:1}
.clear-btn:hover{color:#c0392b}
/* ── Text note ── */
.band-note-row{width:100%;margin-top:6px;display:flex;align-items:flex-start;gap:6px}
.band-note-row textarea{flex:1;background:#1e1e1e;border:1px solid #333;color:#ccc;font-family:'Oswald',sans-serif;font-size:.78rem;border-radius:4px;padding:5px 8px;resize:vertical;min-height:34px;max-height:120px;outline:none;transition:border-color .15s}
.band-note-row textarea:focus{border-color:var(--hf-orange)}
.band-note-row textarea::placeholder{color:#444;font-style:italic}
.band-note-row textarea.has-note{border-color:#555;background:#1a1a1a}
.note-toggle{background:transparent;border:1px solid #333;color:#555;padding:3px 7px;border-radius:3px;font-size:.7rem;cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:.5px;transition:all .15s;white-space:nowrap;flex-shrink:0;margin-top:2px}
.note-toggle:hover{border-color:#555;color:#aaa}
.note-toggle.active{border-color:var(--hf-orange);color:var(--hf-orange)}
@media(min-width:600px){header h1{font-size:3rem}.band-card{padding:14px 20px}.star-group{flex-direction:row;gap:2px}}
@media(max-width:599px){.band-card{flex-wrap:wrap;padding:10px 12px}.rating-wrap input[type=number]{width:60px;font-size:.85rem}}
.empty-state{text-align:center;padding:60px 20px;color:#555;font-size:1.1rem}
.export-bar{text-align:center;padding:20px;background:var(--hf-dark);border-top:1px solid #333;margin-top:20px}
.export-btn{background:var(--hf-orange);color:#fff;border:none;padding:12px 30px;font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;cursor:pointer;border-radius:3px;margin:5px;transition:all .2s}
.export-btn:hover{background:#d14d1a;transform:translateY(-1px)}
.export-btn.secondary{background:#444}
.export-btn.secondary:hover{background:#555}
.io-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:15px 20px;background:#111;border-top:1px solid #333}
.io-btn{background:#2a6b3a;color:#fff;border:none;padding:10px 20px;font-family:'Oswald',sans-serif;font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;border-radius:3px;transition:all .2s}
.io-btn:hover{background:#35854a;transform:translateY(-1px)}
.io-btn.import-btn{background:#2980b9}
.io-btn.import-btn:hover{background:#3498db}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#27ae60;color:#fff;padding:12px 24px;border-radius:6px;font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:600;z-index:400;box-shadow:0 4px 15px rgba(0,0,0,.4);animation:toastIn .3s ease,toastOut .3s ease 2.2s forwards;max-width:90vw;text-align:center}
.toast.error{background:#c0392b}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
#scrollTop{position:fixed;bottom:20px;right:20px;width:44px;height:44px;background:var(--hf-orange);color:#fff;border:none;border-radius:50%;font-size:1.3rem;cursor:pointer;display:none;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-content{background:var(--hf-dark);border:1px solid #444;border-radius:6px;padding:30px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;text-align:center}
.modal-content h2{font-family:'Metal Mania',cursive;color:var(--hf-orange);font-size:1.5rem;margin-bottom:20px}
.modal-content .summary-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #333;font-size:.9rem;align-items:center;gap:8px}
.modal-content .summary-note{font-size:.75rem;color:#777;padding:2px 0 6px;border-bottom:1px solid #222;font-style:italic;text-align:left}
.modal-content .summary-stars{color:var(--hf-gold);white-space:nowrap}
.modal-close{margin-top:20px;background:#444;color:#fff;border:none;padding:10px 25px;font-family:'Oswald',sans-serif;font-size:.9rem;cursor:pointer;border-radius:3px}
.band-modal{background:var(--hf-dark);border:1px solid #444;border-radius:8px;padding:0;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;text-align:left}
.band-modal-header{padding:20px 20px 12px;border-bottom:1px solid #333;display:flex;align-items:flex-start;gap:12px}
.band-modal-title{flex:1}
.band-modal-title h2{font-family:'Metal Mania',cursive;color:var(--hf-orange);font-size:1.4rem;margin-bottom:4px}
.band-modal-title .band-modal-meta{font-size:.75rem;color:var(--hf-grey);display:flex;gap:8px;flex-wrap:wrap}
.band-modal-body{padding:16px 20px}
.band-modal-body .bio{font-size:.85rem;color:#ccc;line-height:1.6;margin-bottom:14px}
.band-modal-body .bio.loading{color:#555;font-style:italic}
.band-modal-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.band-link-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-family:'Oswald',sans-serif;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;border:none;text-decoration:none;transition:all .2s}
.band-link-btn:hover{transform:translateY(-1px);filter:brightness(1.15)}
.btn-spotify{background:#1DB954;color:#fff}
.btn-youtube{background:#FF0000;color:#fff}
.btn-wiki{background:#2a2a2a;color:#eee;border:1px solid #555}
.band-modal-close-btn{margin-top:4px;background:#333;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:1rem;line-height:1}
</style>
</head>

/* ── LocalStorage keys ── */
var LS_KEY='hf26_ratings', LS_NOTE_KEY='hf26_textnotes', LS_PRIO_KEY='hf26_priority';
function loadRatings(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return {};}}
function saveRatings(r){localStorage.setItem(LS_KEY,JSON.stringify(r));}
function loadNotes(){try{return JSON.parse(localStorage.getItem(LS_NOTE_KEY))||{};}catch(e){return {};}}
function saveNotes(n){localStorage.setItem(LS_NOTE_KEY,JSON.stringify(n));}
function loadPriority(){try{return JSON.parse(localStorage.getItem(LS_PRIO_KEY))||{};}catch(e){return {};}}
function savePriority(p){localStorage.setItem(LS_PRIO_KEY,JSON.stringify(p));}

var ratings=loadRatings(), textNotes=loadNotes(), priority=loadPriority();
function bandKey(b){return b.day+'|'+b.name;}
var state={day:FESTIVAL.days[0],stage:'all',sort:'time',search:'',showAll:false};

/* ── Star config ── */
var STARS=[
  {rank:1, emoji:'★', label:'1er choix', cls:'p1'},
  {rank:2, emoji:'★', label:'2e choix',  cls:'p2'},
  {rank:3, emoji:'★', label:'3e choix',  cls:'p3'}
];

document.getElementById('festTitle').textContent=FESTIVAL.name;
document.getElementById('festSubtitle').textContent='Mon Programme - '+FESTIVAL.year;

/* ── Tabs ── */
var tabsEl=document.getElementById('dayTabs');
var nowBtn=document.createElement('button');nowBtn.className='tab-btn now-btn';nowBtn.innerHTML='<span class="pulse"></span>NOW';
nowBtn.onclick=function(){state.showAll=false;var d=getNowDay();if(d){state.day=d;setActiveTab(this);render();}else showToast('Pas de concert en cours','error');};
tabsEl.appendChild(nowBtn);
var allBtn=document.createElement('button');allBtn.className='tab-btn';allBtn.textContent='TOUS';
allBtn.onclick=function(){state.showAll=true;setActiveTab(this);render();};tabsEl.appendChild(allBtn);
FESTIVAL.days.forEach(function(d){
  var btn=document.createElement('button');btn.className='tab-btn'+(d===state.day?' active':'');btn.textContent=d;
  btn.onclick=function(){state.day=d;state.showAll=false;setActiveTab(this);render();};tabsEl.appendChild(btn);
});
function setActiveTab(el){tabsEl.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');}
tabsEl.querySelectorAll('.tab-btn')[2].classList.add('active');

/* ── Stage filters ── */
var stageEl=document.getElementById('stageFilters');
var allF=document.createElement('button');allF.className='filter-btn active';allF.textContent='Toutes les scenes';
allF.onclick=function(){state.stage='all';setActiveFilter(stageEl,this);render();};stageEl.appendChild(allF);
FESTIVAL.stages.forEach(function(s){
  var btn=document.createElement('button');btn.className='filter-btn';btn.textContent=s.short;
  btn.onclick=function(){state.stage=s.id;setActiveFilter(stageEl,this);render();};stageEl.appendChild(btn);
});
function setActiveFilter(c,el){c.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');}

/* ── Sort ── */
var sortEl=document.getElementById('sortRow');
[['time','Horaire'],['name','Nom'],['stage','Scene'],['rating','Note'],['priority','Priorite']].forEach(function(p){
  var btn=document.createElement('button');btn.className='sort-btn'+(p[0]==='time'?' active':'');btn.textContent=p[1];
  btn.onclick=function(){state.sort=p[0];sortEl.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active');});this.classList.add('active');render();};
  sortEl.appendChild(btn);
});
document.getElementById('searchInput').oninput=function(){state.search=this.value.toLowerCase();render();};
window.onscroll=function(){document.getElementById('scrollTop').style.display=window.scrollY>300?'block':'none';};

function getNowDay(){var now=new Date();for(var d in FESTIVAL.dates){if(now.toISOString().slice(0,10)===FESTIVAL.dates[d])return d;}return null;}
function isNowPlaying(b){
  var nd=getNowDay();if(!nd||b.day!==nd)return false;
  var now=new Date(),hm=now.getHours()*60+now.getMinutes();
  function tm(t){var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
  var s=tm(b.start),e=tm(b.end);if(e<s)e+=1440;if(hm<s&&hm<360)hm+=1440;return hm>=s&&hm<e;
}
function getStageCSS(id){var s=FESTIVAL.stages.find(function(x){return x.id===id;});return s?s.css:'';}
function getStageShort(id){var s=FESTIVAL.stages.find(function(x){return x.id===id;});return s?s.short:id;}
function timeToMin(t){var p=t.split(':');var h=parseInt(p[0]),m=parseInt(p[1]);if(h<6)h+=24;return h*60+m;}
function getPrioRank(key){return priority[key]||0;}

/* ── Render ── */
function render(){
  var bands=[].concat(BANDS);
  if(!state.showAll)bands=bands.filter(function(b){return b.day===state.day;});
  if(state.stage!=='all')bands=bands.filter(function(b){return b.stage===state.stage;});
  if(state.search)bands=bands.filter(function(b){return b.name.toLowerCase().indexOf(state.search)>-1;});

  if(state.sort==='name')bands.sort(function(a,b){return a.name.localeCompare(b.name);});
  else if(state.sort==='stage'){bands.sort(function(a,b){var sa=FESTIVAL.stages.findIndex(function(x){return x.id===a.stage;});var sb=FESTIVAL.stages.findIndex(function(x){return x.id===b.stage;});return sa-sb||timeToMin(a.start)-timeToMin(b.start);});}
  else if(state.sort==='rating'){bands.sort(function(a,b){return (ratings[bandKey(b)]||0)-(ratings[bandKey(a)]||0);});}
  else if(state.sort==='priority'){bands.sort(function(a,b){var pa=getPrioRank(bandKey(a))||999,pb=getPrioRank(bandKey(b))||999;return pa-pb||timeToMin(a.start)-timeToMin(b.start);});}
  else{
    if(state.showAll){bands.sort(function(a,b){var di=FESTIVAL.days.indexOf(a.day)-FESTIVAL.days.indexOf(b.day);return di||timeToMin(a.start)-timeToMin(b.start);});}
    else{bands.sort(function(a,b){return timeToMin(a.start)-timeToMin(b.start);});}
  }

  var notedCount=bands.filter(function(b){return ratings[bandKey(b)]!==undefined;}).length;
  var prioCount=bands.filter(function(b){return priority[bandKey(b)]>0;}).length;
  var avg=0;
  if(notedCount>0){var sum=bands.reduce(function(acc,b){return acc+(ratings[bandKey(b)]||0);},0);avg=(sum/notedCount).toFixed(2);}
  document.getElementById('statsBar').innerHTML=
    '<span><strong>'+bands.length+'</strong> groupes</span>'+
    '<span><strong>'+notedCount+'</strong> notes</span>'+
    (notedCount>0?'<span>Moy. <strong>'+avg+'/10</strong></span>':'')+
    (prioCount>0?'<span><strong>'+prioCount+'</strong> favoris</span>':'');

  var grid=document.getElementById('grid');grid.innerHTML='';
  if(!bands.length){grid.innerHTML='<div class="empty-state">Aucun groupe trouve</div>';return;}

  var lastDay='',lastTime='';
  bands.forEach(function(b){
    var key=bandKey(b);var isNow=isNowPlaying(b);
    if(state.showAll&&state.sort==='time'&&b.day!==lastDay){lastDay=b.day;lastTime='';var dh=document.createElement('div');dh.className='day-header';dh.textContent='-- '+b.day+' --';grid.appendChild(dh);}
    if(state.sort==='time'&&b.start!==lastTime){lastTime=b.start;var th=document.createElement('div');th.className='time-header';th.textContent=b.start;grid.appendChild(th);}

    var card=document.createElement('div');card.className='band-card'+(isNow?' now-playing':'');

    /* ── Stars (priority) ── */
    var starGroup=document.createElement('div');starGroup.className='star-group';
    var currentRank=getPrioRank(key);
    STARS.forEach(function(sc){
      var btn=document.createElement('button');
      btn.className='star-btn'+(currentRank===sc.rank?' active':'');
      btn.setAttribute('data-rank',sc.rank);
      btn.title=sc.label;
      btn.style.color=sc.rank===1?'#f1c40f':sc.rank===2?'#e85d26':'#3498db';
      btn.textContent=sc.emoji;
      btn.onclick=function(e){
        e.stopPropagation();
        if(priority[key]===sc.rank){
          /* toggle off */
          delete priority[key];
        }else{
          priority[key]=sc.rank;
        }
        savePriority(priority);
        /* refresh star buttons in this card only */
        var newRank=priority[key]||0;
        starGroup.querySelectorAll('.star-btn').forEach(function(sb){
          sb.classList.toggle('active', parseInt(sb.getAttribute('data-rank'))===newRank);
        });
      };
      starGroup.appendChild(btn);
    });
    card.appendChild(starGroup);

    /* ── Band info ── */
    var info=document.createElement('div');info.className='band-info';
    var nameEl=document.createElement('div');nameEl.className='band-name';
    var prioRank=getPrioRank(key);
    var badgeHtml='';
    if(prioRank===1)badgeHtml='<span class="prio-badge p1">1er</span>';
    else if(prioRank===2)badgeHtml='<span class="prio-badge p2">2e</span>';
    else if(prioRank===3)badgeHtml='<span class="prio-badge p3">3e</span>';
    nameEl.innerHTML=b.name+(isNow?'<span class="now-badge">NOW</span>':'')+badgeHtml;
    nameEl.onclick=function(){openBandModal(b);};info.appendChild(nameEl);
    var meta=document.createElement('div');meta.className='band-meta';
    meta.innerHTML='<span class="stage-badge '+getStageCSS(b.stage)+'">'+getStageShort(b.stage)+'</span><span>'+b.start+'-'+b.end+'</span>';
    info.appendChild(meta);card.appendChild(info);

    /* ── Rating input ── */
    var wrap=document.createElement('div');wrap.className='rating-wrap';
    var inp=document.createElement('input');inp.type='number';inp.min='0';inp.max='10';inp.step='any';
    inp.placeholder='—';inp.title='Note sur 10 (ex: 7.5 ou 2.33)';
    var currentRating=ratings[key];
    if(currentRating!==undefined&&currentRating!==null){inp.value=currentRating;inp.classList.add('has-value');}
    var suffix=document.createElement('span');suffix.className='rating-suffix'+(currentRating!==undefined&&currentRating!==null?' has-value':'');suffix.textContent='/10';
    inp.oninput=function(){
      var raw=this.value.replace(',','.');var v=parseFloat(raw);
      if(this.value===''||isNaN(v)){delete ratings[key];saveRatings(ratings);this.classList.remove('has-value');suffix.classList.remove('has-value');}
      else{ratings[key]=v;saveRatings(ratings);this.classList.add('has-value');suffix.classList.add('has-value');}
    };
    inp.onblur=function(){
      if(this.value!==''){var raw=this.value.replace(',','.');var v=parseFloat(raw);
        if(!isNaN(v)){if(v<0)v=0;if(v>10)v=10;this.value=v;ratings[key]=v;saveRatings(ratings);this.classList.add('has-value');suffix.classList.add('has-value');}}
    };
    var clearBtn=document.createElement('button');clearBtn.className='clear-btn';clearBtn.title='Effacer';clearBtn.textContent='x';
    clearBtn.onclick=function(){delete ratings[key];saveRatings(ratings);inp.value='';inp.classList.remove('has-value');suffix.classList.remove('has-value');};
    wrap.appendChild(inp);wrap.appendChild(suffix);wrap.appendChild(clearBtn);card.appendChild(wrap);

    /* ── Text note ── */
    var noteRow=document.createElement('div');noteRow.className='band-note-row';
    var hasNote=textNotes[key]&&textNotes[key].trim().length>0;
    var noteToggle=document.createElement('button');noteToggle.className='note-toggle'+(hasNote?' active':'');noteToggle.textContent=hasNote?'Note':'+ Note';
    var textarea=document.createElement('textarea');textarea.placeholder='Ajouter une note...';textarea.style.display=hasNote?'block':'none';
    if(hasNote){textarea.value=textNotes[key];textarea.classList.add('has-note');}
    noteToggle.onclick=function(){
      if(textarea.style.display==='none'){textarea.style.display='block';textarea.focus();noteToggle.classList.add('active');noteToggle.textContent='Note';}
      else{textarea.style.display='none';if(textNotes[key]&&textNotes[key].trim()){noteToggle.classList.add('active');noteToggle.textContent='Note';}else{noteToggle.classList.remove('active');noteToggle.textContent='+ Note';}}
    };
    textarea.oninput=function(){textNotes[key]=this.value;saveNotes(textNotes);if(this.value.trim()){this.classList.add('has-note');noteToggle.classList.add('active');noteToggle.textContent='Note';}else{this.classList.remove('has-note');}};
    noteRow.appendChild(noteToggle);noteRow.appendChild(textarea);card.appendChild(noteRow);
    grid.appendChild(card);
  });
}

/* ── Summary modal ── */
function showSummary(){
  var rated=BANDS.filter(function(b){return ratings[bandKey(b)]!==undefined||priority[bandKey(b)]>0;});
  rated.sort(function(a,b){
    var pa=priority[bandKey(a)]||999,pb=priority[bandKey(b)]||999;
    if(pa!==pb)return pa-pb;
    return (ratings[bandKey(b)]||0)-(ratings[bandKey(a)]||0);
  });
  var html='<h2>Mon Recap</h2>';
  if(!rated.length){html+='<p style="color:#555;margin:20px 0">Aucun groupe note pour l instant.</p>';}
  else{
    var ratedOnly=rated.filter(function(b){return ratings[bandKey(b)]!==undefined;});
    if(ratedOnly.length){var total=ratedOnly.reduce(function(acc,b){return acc+(ratings[bandKey(b)]||0);},0);html+='<p style="color:var(--hf-grey);font-size:.8rem;margin-bottom:16px">'+ratedOnly.length+' note(s) - Moyenne : <strong style="color:var(--hf-gold)">'+(total/ratedOnly.length).toFixed(2)+'/10</strong></p>';}
    rated.forEach(function(b){
      var key=bandKey(b);var r=ratings[key];var note=textNotes[key]?textNotes[key].trim():'';
      var pRank=priority[key]||0;
      var badge='';
      if(pRank===1)badge='<span class="prio-badge p1" style="font-size:.6rem">1er</span> ';
      else if(pRank===2)badge='<span class="prio-badge p2" style="font-size:.6rem">2e</span> ';
      else if(pRank===3)badge='<span class="prio-badge p3" style="font-size:.6rem">3e</span> ';
      html+='<div class="summary-item"><span>'+badge+b.name+'<br><small style="color:#555">'+b.day+' - '+getStageShort(b.stage)+' - '+b.start+'</small></span><span class="summary-stars">'+(r!==undefined?r+'/10':'-')+'</span></div>';
      if(note)html+='<div class="summary-note">'+note+'</div>';
    });
  }
  html+='<button class="modal-close" onclick="closeModal()">Fermer</button>';
  document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').onclick=function(e){if(e.target===this)closeModal();};

/* ── Band modal ── */
function openBandModal(b){
  var s=FESTIVAL.stages.find(function(x){return x.id===b.stage;});var css=s?s.css:'';
  var html='<div class="band-modal-header"><div class="band-modal-title"><h2>'+b.name+'</h2><div class="band-modal-meta"><span class="stage-badge '+css+'">'+b.stage+'</span><span>'+b.day+'</span><span>'+b.start+' - '+b.end+'</span></div></div><button class="band-modal-close-btn" onclick="closeBandModal()">X</button></div><div class="band-modal-body"><p class="bio loading" id="bandBio">Chargement...</p><div class="band-modal-links"><a class="band-link-btn btn-spotify" href="https://open.spotify.com/search/'+encodeURIComponent(b.name)+'" target="_blank">Spotify</a><a class="band-link-btn btn-youtube" href="https://www.youtube.com/results?search_query='+encodeURIComponent(b.name)+'" target="_blank">YouTube</a><a class="band-link-btn btn-wiki" href="https://fr.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(b.name)+'" target="_blank">Wiki</a></div></div>';
  document.getElementById('bandModalBody').innerHTML=html;document.getElementById('bandModal').classList.add('show');
  setTimeout(function(){var bio=document.getElementById('bandBio');if(bio){bio.textContent='Cliquez sur les liens pour en savoir plus sur '+b.name+'.';bio.classList.remove('loading');}},600);
}
function closeBandModal(){document.getElementById('bandModal').classList.remove('show');}
document.getElementById('bandModal').onclick=function(e){if(e.target===this)closeBandModal();};

/* ── Export / Import ── */
function exportRatings(){
  var data={ratings:ratings,textNotes:textNotes,priority:priority,exported:new Date().toISOString(),festival:FESTIVAL.name+' '+FESTIVAL.year};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hellfest2026_notes.json';a.click();
  showToast('Notes exportees !');
}
function importRatings(evt){
  var file=evt.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.ratings){ratings=data.ratings;saveRatings(ratings);}
      if(data.textNotes){textNotes=data.textNotes;saveNotes(textNotes);}
      if(data.priority){priority=data.priority;savePriority(priority);}
      render();showToast('Notes importees !');
    }catch(err){showToast('Fichier invalide','error');}
  };
  reader.readAsText(file);evt.target.value='';
}
function resetAll(){
  if(!confirm('Remettre toutes les notes a zero ?'))return;
  ratings={};textNotes={};priority={};
  saveRatings(ratings);saveNotes(textNotes);savePriority(priority);
  render();showToast('Notes reinitialisees');
}
function showToast(msg,type){var t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
render();
</script>
